<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), lanes=[-2.35,0,2.35], phases=[
{name:"Cidade",sky:0x68cfff,ground:0x5dba5c,road:0x4d5261,fog:0xa9e4ff},
{name:"Praia",sky:0x49cfff,ground:0xf4d681,road:0xe7bd72,fog:0xb9efff},
{name:"Vulcão",sky:0x7d2935,ground:0x33242b,road:0x45333a,fog:0x8c3b3a},
{name:"Deserto",sky:0xff9a57,ground:0xe7ad55,road:0xc9894c,fog:0xffc47a}
], outfits={luna:[["Rosa",0,0xff5d9e],["Céu",100,0x59bfff],["Limão",180,0x9be65b],["Roxo",260,0x9d62ff],["Dourado",380,0xffc83d],["Noite",500,0x263d77]],teddy:[["Azul",0,0x3488ff],["Verde",100,0x45c777],["Laranja",180,0xff8c42],["Roxo",260,0x8d63df],["Vermelho",380,0xe84b55],["Dourado",500,0xe8b72f]]};
function lsGet(key,fallback){try{let v=localStorage.getItem(key);return v===null?fallback:v}catch(e){return fallback}}
function lsSet(key,value){try{localStorage.setItem(key,String(value));return true}catch(e){return false}}
let char=lsGet("ltChar","luna"),phase=+(lsGet("ltPhase","0")),diff=lsGet("ltDiff","easy"),wallet=+(lsGet("ltWallet","0")),best=+(lsGet("ltBest","0"));
let owned,selected;try{owned=JSON.parse(lsGet("ltOwned",'{"luna":[0],"teddy":[0]}'));selected=JSON.parse(lsGet("ltSelected",'{"luna":0,"teddy":0}'))}catch(e){owned={luna:[0],teddy:[0]};selected={luna:0,teddy:0}}
let soundOn=lsGet("ltSound","1")!=="0",graphics=lsGet("ltGraphics","light"),state="home",score=0,coins=0,lives=3,distance=0,speed=11,magnet=0,shield=0,boost=0,invuln=0,slide=0,stumble=0,celebrate=0,last=0,spawnT=.8,coinT=.2,powerT=7,starT=4,flyT=10,mysteryT=7,combo=0,comboClock=0,fly=0,flyHeight=0,flyBlink=false,saveClock=0,sceneryT=0,objs=[],movingScenery=[],seaRef=null,lavaRiverRefs=[],player,world,roadSegments=[],clouds=[],ac,musicTimer,musicStep=0,wasPlaying=false,fpsFrames=0,fpsLast=performance.now(),fpsValue=60;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,240),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.38;document.body.prepend(renderer.domElement);
camera.position.set(0,5.2,9);camera.lookAt(0,1,-10);
scene.add(new THREE.HemisphereLight(0xf2fbff,0x665276,2.9));const sun=new THREE.DirectionalLight(0xfff1d0,4);sun.position.set(-8,14,8);sun.castShadow=true;scene.add(sun);
const mat=(c,opt={})=>new THREE.MeshStandardMaterial({color:c,roughness:opt.roughness??.72,metalness:opt.metalness??0,emissive:opt.emissive||0,emissiveIntensity:opt.ei||0,transparent:opt.transparent||false,opacity:opt.opacity??1});const GEO={
 coin:new THREE.TorusGeometry(.25,.09,5,10),particle:new THREE.BoxGeometry(.09,.09,.09),
 rock:new THREE.OctahedronGeometry(.65),log:new THREE.CylinderGeometry(.35,.35,1.55,8),
 fireS:new THREE.SphereGeometry(.32,8,6),fireG:new THREE.SphereGeometry(.42,8,6)
},FXGEO={
 dust:new THREE.SphereGeometry(.06,4,3),
 ash:new THREE.BoxGeometry(.045,.045,.045),
 lavaBall:new THREE.SphereGeometry(.28,6,4),
 sand:new THREE.BoxGeometry(.12,.03,.03)
},FXMAT={
 dust:new THREE.MeshBasicMaterial({color:0xd7c7a5,transparent:true,opacity:.6}),
 ashOrange:new THREE.MeshBasicMaterial({color:0xff8a32}),
 ashDark:new THREE.MeshBasicMaterial({color:0x55464a}),
 lavaBall:new THREE.MeshStandardMaterial({color:0xff5a18,roughness:.72,emissive:0xff2100,emissiveIntensity:2.8}),
 sand:new THREE.MeshBasicMaterial({color:0xe9c27b})
},MAT={
 coin:new THREE.MeshStandardMaterial({color:0xffd83d,roughness:.35,metalness:.65,emissive:0x7a4d00,emissiveIntensity:.6}),
 rock:new THREE.MeshStandardMaterial({color:0x737987,roughness:.75}),
 log:new THREE.MeshStandardMaterial({color:0x7a4c2b,roughness:.8}),
 fire:new THREE.MeshStandardMaterial({color:0xff5a19,roughness:.45,emissive:0xff2b00,emissiveIntensity:2})
};
const mesh=(g,m)=>{let x=new THREE.Mesh(g,m);x.castShadow=false;x.receiveShadow=false;return x};
function save(){lsSet("ltChar",char);lsSet("ltPhase",phase);lsSet("ltDiff",diff);lsSet("ltWallet",wallet);lsSet("ltBest",best);lsSet("ltOwned",JSON.stringify(owned));lsSet("ltSelected",JSON.stringify(selected));lsSet("ltSound",soundOn?"1":"0");lsSet("ltGraphics",graphics)}
function clearWorld(){
 if(world){
  const sharedGeo=new Set([...Object.values(GEO),...Object.values(FXGEO)]);
  const sharedMat=new Set([...Object.values(MAT),...Object.values(FXMAT),...particleMats.values()]);
  world.traverse(n=>{if(!n.isMesh)return;if(n.geometry&&!sharedGeo.has(n.geometry))n.geometry.dispose?.();let ms=Array.isArray(n.material)?n.material:[n.material];for(let m of ms)if(m&&!sharedMat.has(m))m.dispose?.()});
  scene.remove(world)
 }
 world=new THREE.Group();scene.add(world);objs=[];roadSegments=[];clouds=[];movingScenery=[];seaRef=null;lavaRiverRefs=[]
}
function box(x,y,z,c){return mesh(new THREE.BoxGeometry(x,y,z),mat(c))}
function tree(x,z,palm=false){let g=new THREE.Group(),tr=box(.28,1.8,.28,palm?0x9a6437:0x765036);tr.position.y=.9;g.add(tr);if(palm){for(let i=0;i<6;i++){let l=box(.15,.08,1.45,0x27ad68);l.position.y=1.85;l.rotation.y=i*Math.PI/3;l.position.x=Math.sin(l.rotation.y)*.45;l.position.z=Math.cos(l.rotation.y)*.45;g.add(l)}}else{let crown=mesh(new THREE.ConeGeometry(.85,2.2,8),mat(0x2da45d));crown.position.y=2.25;g.add(crown)}g.position.set(x,0,z);g.userData.sceneryMove=true;world.add(g);movingScenery.push(g)}
function cloud(x,y,z){let g=new THREE.Group();for(let i=0;i<4;i++){let s=mesh(new THREE.SphereGeometry(.65+i*.08,12,8),mat(0xffffff));s.position.set(i*.7,Math.sin(i)*.2,0);g.add(s)}g.position.set(x,y,z);world.add(g);clouds.push(g)}
function mountain(x,z,c=0x7e8292,s=1){let m=mesh(new THREE.ConeGeometry(5*s,10*s,7),mat(c));m.position.set(x,4.5*s,z);world.add(m)}
function house(x,z){let g=new THREE.Group(),b=box(2.1,1.8,2,0xffd16a);b.position.y=.9;g.add(b);let r=mesh(new THREE.ConeGeometry(1.7,1.25,4),mat(0xe85c54));r.position.y=2.25;r.rotation.y=Math.PI/4;g.add(r);let d=box(.45,.9,.05,0x70472d);d.position.set(0,.45,1.02);g.add(d);g.position.set(x,0,z);g.userData.sceneryMove=true;world.add(g);movingScenery.push(g)}
function cactus(x,z){let g=new THREE.Group(),b=box(.42,2.3,.42,0x2f9c5a);b.position.y=1.15;g.add(b);for(let s of[-1,1]){let a=box(.28,.9,.28,0x2f9c5a);a.position.set(s*.45,1.2,0);g.add(a);let arm=box(.55,.28,.28,0x2f9c5a);arm.position.set(s*.28,.8,0);g.add(arm)}g.position.set(x,0,z);g.userData.sceneryMove=true;world.add(g);movingScenery.push(g)}
function umbrella(x,z){let g=new THREE.Group(),p=box(.12,1.7,.12,0xf3f0d5);p.position.y=.85;g.add(p);let u=mesh(new THREE.ConeGeometry(1.15,.45,16),mat(Math.random()<.5?0xff5d75:0x49a8ff));u.position.y=1.75;g.add(u);g.position.set(x,0,z);g.userData.sceneryMove=true;world.add(g);movingScenery.push(g)}
function lavaRiver(x){let r=box(4,.06,150,0xff4b18);r.material=mat(0xff4b18,{emissive:0xff2600,ei:1.6});r.position.set(x,.03,-55);world.add(r);lavaRiverRefs.push(r)}
function setPhase(n){phase=n;save();clearWorld();let p=phases[phase];scene.background=new THREE.Color(p.sky);scene.fog=new THREE.Fog(p.fog,45,145);
for(let i=0;i<18;i++){let r=box(7.5,.18,8,p.road);r.position.set(0,-.1,-i*8+8);world.add(r);roadSegments.push(r);for(let side of[-1,1]){let g=box(7,.1,8,p.ground);g.position.set(side*7.25,-.12,-i*8+8);world.add(g);roadSegments.push(g)}}for(let z=8;z>-140;z-=5){for(let x of[-1.18,1.18]){let mk=box(.08,.025,2.4,phase===2?0xff9d35:0xffef70);mk.position.set(x,.015,z);world.add(mk);roadSegments.push(mk)}}
for(let i=0;i<(graphics==="light"?4:8);i++)cloud(-18+i*(graphics==="light"?10:5),9+Math.random()*4,-35-i*(graphics==="light"?20:10));
if(phase===0){for(let z=-10;z>-130;z+=(graphics==="light"?-26:-13)){tree(-5.4,z);tree(5.4,z-5);if(graphics!=="light"&&z%26===-10){house(-9,z-3);house(9,z-9)}}for(let x of[-18,-9,10,19])mountain(x,-125,0x71849b,1.1)}
if(phase===1){let sea=box(18,.08,150,0x1f9de0);sea.material=mat(0x1f9de0,{metalness:.1,roughness:.3});sea.position.set(-13,-.03,-55);world.add(sea);seaRef=sea;for(let z=-8;z>-135;z+=(graphics==="light"?-28:-14)){tree(-6,z,true);tree(6,z-5,true);umbrella(-9,z-2);if(graphics!=="light"&&Math.random()<.7)umbrella(9,z-7)}mountain(-22,-135,0x5889a0,.8)}
if(phase===2){
  // Vulcão gigante ao fundo, com cone escuro e cratera brilhante.
  let volcano=new THREE.Group();
  let cone=mesh(new THREE.ConeGeometry(13,23,14,1,true),mat(0x24191d));
  cone.position.y=9.5;volcano.add(cone);
  let crater=mesh(new THREE.TorusGeometry(4.2,.7,10,28),mat(0xff5a18,{emissive:0xff2600,ei:2.8}));
  crater.rotation.x=Math.PI/2;crater.position.y=20.5;volcano.add(crater);
  let lavaCore=mesh(new THREE.CylinderGeometry(3.7,2.8,.35,24),mat(0xff7a19,{emissive:0xff2600,ei:3}));
  lavaCore.position.y=20.25;volcano.add(lavaCore);
  // Trilhas de lava descendo o vulcão.
  for(let i=0;i<5;i++){
    let flow=box(.55+Math.random()*.35,.12,9+Math.random()*5,0xff5a16);
    flow.material=mat(0xff5a16,{emissive:0xff2200,ei:2.5});
    flow.position.set((i-2)*1.45,13.2,-2.4);
    flow.rotation.x=.58;volcano.add(flow);
  }
  volcano.position.set(0,0,-132);world.add(volcano);volcano.userData={volcano:true,crater,lavaCore};

  // Rios de lava brilhantes dos dois lados da pista.
  lavaRiver(-8);lavaRiver(8);

  // Montanhas vulcânicas escuras ao fundo.
  mountain(-20,-138,0x21191d,1.45);mountain(-11,-145,0x342329,1.1);
  mountain(13,-142,0x2a1c21,1.35);mountain(22,-150,0x1e171b,1.6);

  // Laterais cheias de rochas, poças e rachaduras brilhantes.
  for(let z=-8;z>-138;z+=(graphics==="light"?-14:-7)){
    for(let side of[-1,1]){
      let x=side*(5.3+Math.random()*5.2);
      let r=mesh(new THREE.OctahedronGeometry(.35+Math.random()*1.05),mat(Math.random()<.35?0x171317:0x30262a));
      r.position.set(x,.35+Math.random()*.35,z-Math.random()*4);r.rotation.set(Math.random(),Math.random(),Math.random());
      r.userData={volcanoScenery:true};world.add(r);objs.push(r);

      if(Math.random()<.48){
        let pool=mesh(new THREE.CircleGeometry(.65+Math.random()*1.0,16),mat(0xff5718,{emissive:0xff2100,ei:2.4}));
        pool.rotation.x=-Math.PI/2;pool.position.set(side*(6+Math.random()*5),.015,z-2-Math.random()*4);
        pool.userData={volcanoScenery:true,lavaPool:true,baseScale:pool.scale.x};world.add(pool);objs.push(pool);
      }
      if(Math.random()<.58){
        let crack=box(.10,.025,1.4+Math.random()*1.5,0xff6a19);
        crack.material=mat(0xff6a19,{emissive:0xff2400,ei:2.8});
        crack.position.set(side*(5+Math.random()*6),.025,z-Math.random()*3);
        crack.rotation.y=(Math.random()-.5)*1.5;
        crack.userData={volcanoScenery:true,crack:true};world.add(crack);objs.push(crack);
      }
    }
  }

  // Fumaça permanente acima da cratera.
  for(let i=0;i<(graphics==="light"?8:18);i++){
    let smoke=mesh(new THREE.SphereGeometry(.7+Math.random()*1.4,10,7),
      new THREE.MeshStandardMaterial({color:Math.random()<.4?0x4a3438:0x29252a,transparent:true,opacity:.45+Math.random()*.25,roughness:1}));
    smoke.position.set((Math.random()-.5)*5,22+Math.random()*15,-132+(Math.random()-.5)*4);
    smoke.userData={volcanoSmoke:true,phase:Math.random()*6};world.add(smoke);objs.push(smoke);
  }
}
if(phase===3){for(let x of[-20,-10,10,20])mountain(x,-125,0xc7793c,1+Math.random()*.6);for(let z=-8;z>-135;z+=(graphics==="light"?-24:-12)){cactus(-5.5-Math.random()*5,z);cactus(5.5+Math.random()*5,z-5)}}}
function createPlayer(){
if(player){if(player.userData&&player.userData.blob)scene.remove(player.userData.blob);scene.remove(player);}
player=new THREE.Group();
player.userData={lane:1,jump:0,vy:0,limbs:[],hair:[],cloth:[],lean:0};

let skin=0xf1b28f,hair=0x59351f,col=outfits[char][selected[char]||0][2];
const block=(x,y,z,c)=>mesh(new THREE.BoxGeometry(x,y,z),mat(c));

// Tronco em bloco
let torso=block(.88,1.02,.48,col);
torso.position.set(0,1.30,0);
player.add(torso);

// Cabeça quadrada
let head=block(.72,.72,.66,skin);
head.position.set(0,2.17,0);
player.add(head);

// Cabelo em blocos, preso à cabeça
let hairTop=block(.76,.18,.70,hair);
hairTop.position.set(0,2.54,-.01);
player.add(hairTop);
let hairBack=block(.74,.48,.13,hair);
hairBack.position.set(0,2.25,-.34);
player.add(hairBack);

if(char==="luna"){
  let leftHair=block(.14,.66,.16,hair);
  leftHair.position.set(-.37,2.10,-.23);
  player.add(leftHair);
  let rightHair=block(.14,.66,.16,hair);
  rightHair.position.set(.37,2.10,-.23);
  player.add(rightHair);
}

if(o.userData.type==="mystery"){o.rotation.y+=dt*2.5;if(o.position.distanceTo(_playerHit.copy(player.position).setY(player.position.y+.8))<1.2){let rr=Math.random();if(rr<.34){magnet=8;toast("🎁 Caixa: ÍMÃ!")}else if(rr<.68){shield=8;toast("🎁 Caixa: ESCUDO!")}else{wallet+=20;coins+=20;score+=100;toast("🎁 Caixa: +20 moedas!")}sfx("power");particle(_fxPos.copy(o.position),0xff74dc,16);if(!recycle(o)){world.remove(o);disposeObject(o);objs.splice(objs.indexOf(o),1)}continue}}
if(["magnet","shield"].includes(o.userData.type)&&o.position.distanceTo(_playerHit.copy(player.position).setY(player.position.y+.8))<1.15){if(o.userData.type==="magnet")magnet=8;else shield=8;sfx("power");toast(o.userData.type==="magnet"?"🧲 Ímã por 8 segundos!":"🛡️ Escudo por 8 segundos!");if(!recycle(o)){world.remove(o);disposeObject(o);objs.splice(objs.indexOf(o),1)}continue}
if(["monster","fire","flame","obstacle","train","lowbar","ramp"].includes(o.userData.type)&&o.position.z>1.2&&o.position.z<3.2&&Math.abs(o.position.x-player.position.x)<.78){
if(fly>0){if(!recycle(o)){world.remove(o);disposeObject(o);objs.splice(objs.indexOf(o),1)}continue}

if(o.position.z>13){if(!recycle(o)){disposeObject(o);world.remove(o);objs.splice(oi,1)}}
}if(distance>=3000)winPhase();hud()
}
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000||.016);last=now;fpsFrames++;if(now-fpsLast>=500){fpsValue=Math.round(fpsFrames*1000/(now-fpsLast));fpsFrames=0;fpsLast=now;$("fps").textContent="FPS: "+fpsValue}if(state==="play")update(dt);renderer.render(scene,camera)}
function renderHome(){document.querySelectorAll("[data-char]").forEach(b=>b.classList.toggle("active",b.dataset.char===char));document.querySelectorAll("[data-diff]").forEach(b=>b.classList.toggle("active",b.dataset.diff===diff));$("sound").textContent=soundOn?"🔊 Som":"🔇 Som";$("graphics").textContent="⚙️ Gráficos: "+(graphics==="light"?"Leve":"Normal");$("phaseBtns").innerHTML=phases.map((p,i)=>`<button class="btn ${i===phase?"active":""}" data-phase="${i}">${["🏙️","🏖️","🌋","🏜️"][i]} ${p.name}</button>`).join("");document.querySelectorAll("[data-phase]").forEach(b=>b.onclick=()=>{phase=+b.dataset.phase;setPhase(phase);renderHome()})}

function openShop(){wasPlaying=state==="play";if(wasPlaying)state="paused";renderShop();$("shop").style.display="grid"}function closeShop(){$("shop").style.display="none";if(wasPlaying)state="play";else $("home").style.display="grid"}

$("play").onclick=play;$("clothes").onclick=openShop;$("shopGame").onclick=openShop;$("closeShop").onclick=closeShop;$("sound").onclick=()=>{soundOn=!soundOn;save();if(soundOn)musicStart();renderHome()};
